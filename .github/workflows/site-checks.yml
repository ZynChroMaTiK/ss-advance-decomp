name: Check project website
on:
  workflow_call:
  pull_request:
    paths: ['site/**', 'scripts/test_site*', 'scripts/build_site_graphics.py', 'scripts/graphics_content.py', '.github/workflows/site-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify level geometry and backface culling
        run: node scripts/test_site.mjs
      - name: Verify unified routing and iframe bridge
        run: node scripts/test_site_routes.mjs
      - name: Verify explorer loading and recovery
        run: node scripts/test_site_viewer_loading.mjs
      - name: Verify atlas keyboard controls and lookup
        run: node scripts/test_site_atlas.mjs
      - name: Verify per-level atlas delivery and loading races
        run: node scripts/test_site_atlas_loading.mjs
      - name: Verify object lookup, touch input and reference deep links
        run: node scripts/test_site_explorer_controls.mjs
      - name: Verify NETRICSA entries, search, links and artwork
        run: node scripts/test_site_wiki.mjs
      - name: Verify graphics browsing, palettes and downloads
        run: node scripts/test_site_graphics.mjs
      - name: Verify unique graphics, content groups and original PNGs
        run: python3 scripts/test_site_graphics.py
      - name: Verify resources below the Pages project prefix
        run: python3 scripts/test_site_http.py
      - name: Verify reference links, content and offline maps
        run: python3 scripts/test_site_audit.py
      - name: Install reference renderer
        run: python3 -m pip install -r scripts/site-document-requirements.txt
      - name: Verify reference rendering
        run: python3 scripts/test_site_documents.py
